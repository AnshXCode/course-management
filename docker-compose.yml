services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: ./server
    ports:
      - "5001:5001"
    env_file:
      - ./server/.env
    environment:
      REDIS_URL: redis://redis:6379
      CLIENT_URL: http://localhost:5173
    depends_on:
      - redis

  client:
    build:
      context: ./client
      args:
        VITE_API_BASE: http://localhost:5001/api
    ports:
      - "5173:80"
    depends_on:
      - api